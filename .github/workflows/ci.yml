# Intégration continue (D-047) : sur `develop` et sur les pull requests vers `main`.
# Typage, lint, format, tests unitaires et d'intégration (PGlite, sans base),
# build de production, tests de bout en bout (Chrome du runner) et audit.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # Valeurs factices : la CI n'ouvre aucune base (tests sur PGlite, aperçu de
      # démonstration local au navigateur). Jamais de secret réel ici.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      APP_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_SITE_INDEXABLE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Clé de chiffrement éphémère
        run: echo "AUTH_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Typage
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests unitaires
        run: pnpm test

      - name: Tests d'intégration
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Tests de bout en bout
        run: pnpm test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Audit des dépendances
        run: pnpm audit --audit-level high
